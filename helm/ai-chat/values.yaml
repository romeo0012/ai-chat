# Default values for ai-chat.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1
configHash: "1" # configuration change detection
codenow:
  instance: ""
  applicationName: ""
  applicationRuntimeName: ""
  applicationVersion: ""
  componentRuntimeName: "ai-chat"
  componentName: "ai-chat"
  componentVersion: ${project.version}
  templateId: ""
  domainName: "tmobile-demo.codenow.com"
  environmentId: ""
  serviceMeshGateway: "istio-system/public-gateway"

# Runtime environment variables injected as a Kubernetes Secret (values must be
# base64-only safe plain text here — see templates/secret.yaml). Never commit
# real API keys with plain values; set them in the CI/CD pipeline instead.
# The full set of app env vars lives in codenow/config/environment-variables.
environmentVariables: {}

buildNumber: "${env.BUILD_NUMBER}"

image:
  pullPolicy: IfNotPresent
  pullSecrets:
    - name: docker-user-registry

service:
  type: ClusterIP
  port: 3002
  externalEndpointEnabled: true

fluentbit:
  istioProxy:
    enabled: true
    parser: envoy-logging-filter-parser
  parser: oxus-app-component-json

configFiles: {}

resources: {}

nodeSelector: {}

tolerations: []

affinity: {}
